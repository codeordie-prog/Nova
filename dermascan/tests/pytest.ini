[pytest]
testpaths = dermascan/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: pure logic, mocked Redis/providers, fast CI gate
    integration: real Redis container, streams/locks, no paid external APIs
    concurrency: multi-thread/process correctness and race conditions
    load: sustained RPS, Locust/k6, needs live stack
    soak: long-duration stability (memory/leaks/drift)
    chaos: fault injection (Redis drop, provider down, worker kill)
    slow: anything longer than a few seconds
addopts =
    -ra
    --strict-markers
