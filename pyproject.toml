[tool.poetry]
name = "dermascan"
version = "0.1.0"
description = "AI agents network for medical diagnosis"
authors = ["Kelvin Ndeti <kelvinndeti3142@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "dermascan" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
modal = "^1.3.5"
huggingface-hub = "^1.5.0"
requests = "^2.32.5"
transformers = "^5.3.0"
torch = "^2.10.0"
pillow = "^12.1.1"
accelerate = "^1.13.0"
fastapi = "^0.135.1"
tavily = "^1.1.0"
redis = {extras = ["hiredis"], version = "^7.3.0"}
python-multipart = "^0.0.22"
uvicorn = "^0.42.0"
python-dotenv = "^1.2.2"
dotenv = "^0.9.9"
pytest = "^9.0.3"
langchain = "^1.2.15"
langchain-openai = "^1.1.14"
langgraph = "^1.1.8"
langchain-google-genai = "^4.2.2"
langgraph-checkpoint-redis = "^0.4.1"
langchain-google-vertexai = "^3.2.2"
pinecone = "^9.0.0"
langchain-community = "^0.4.1"
pypdf = "^6.11.0"
pymupdf = "^1.27.2.3"
pytesseract = "^0.3.13"
psycopg = {extras = ["binary", "pool"], version = "^3.3.4"}
psycopg2-binary = "^2.9.12"
firebase = "^4.0.1"
firebase-admin = "^7.4.0"
boto3 = "^1.43.18"
langchain-google-community = "^4.0.0"
langsmith = "^0.9.1"
sounddevice = "^0.5.6"
keyboard = "^0.13.5"


[tool.poetry.group.dev.dependencies]
fakeredis = "^2.36.2"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
freezegun = "^1.5.5"
httpx = "^0.28.1"
hypothesis = "^6.155.6"
testcontainers = "^4.14.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"