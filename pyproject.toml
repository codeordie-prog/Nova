[tool.poetry]
name = "dermascan"
version = "0.1.0"
description = "AI agents network for medical diagnosis"
authors = ["Kelvin Ndeti <kelvinndeti3142@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "dermascan" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
modal = "^1.3.5"
huggingface-hub = "^1.5.0"
requests = "^2.32.5"
transformers = "^5.3.0"
torch = "^2.10.0"
pillow = "^12.1.1"
accelerate = "^1.13.0"
fastapi = "^0.135.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
